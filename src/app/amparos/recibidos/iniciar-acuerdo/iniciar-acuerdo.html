<app-spinner [isLoading]="isLoading"></app-spinner>


<div class="sticky top-0 z-50 bg-surface-50 dark:bg-surface-900 flex flex-col gap-4">
  <!-- BREADCRUMB -->
  <app-breadcrub></app-breadcrub>

  <!-- ENCABEZADO -->
  <div class="bg-surface-50 dark:bg-surface-900 border border-surface rounded-2xl p-4">
    <div class="flex items-start flex-col md:flex-row justify-between">
      <div>
        <label class="font-bold text-2xl text-surface-900 dark:text-surface-0 mb-4 md:mb-0">
          Consultar asunto
        </label>

        <div class="flex items-center text-surface-700 dark:text-surface-300 flex-wrap gap-8">
          <div class="flex items-center gap-2">
            <i class="pi pi-users text-base! leading-normal!"></i>
            <span>Para buscar un asunto partiendo de un expediente físico, capture los siguientes campos obligatarios</span>
            <p class="text-gray-500 dark:text-gray-400">Para buscar un asunto partiendo de un expediente físico, capture los siguientes campos
                obligatarios
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="bg-surface-50 dark:bg-surface-900 border border-surface rounded-2xl p-4 mt-4">
  <div [formGroup]="acuerdoForm" class="grid grid-cols-12 gap-4 w-full items-end">
    <!-- Ambito -->
    <div class="col-span-12 sm:col-span-6">
      <label class="block mb-2 text-sm font-medium">Ámbito*</label>
      <p-select id="ambito" [options]="ambito()" formControlName="ambito"
        optionLabel="descripcion" appendTo="body" filterPlaceholder="Buscar ámbito..."
        inputId="ambito-dropdown" fluid></p-select>

    </div>
  </div>
</div>
