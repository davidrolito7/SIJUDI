<app-spinner [isLoading]="isLoading"></app-spinner>
<div class="lg:sticky top-0 z-50  flex flex-col gap-4 bg-surface-0 dark:bg-surface-900">

    <!-- HEADER -->
    <app-breadcrub></app-breadcrub>
    <!-- BUSQUEDA -->
    <div class=" border border-surface rounded-2xl p-4">
        <div class="font-medium text-2xl ">
            Audiencias Programadas
        </div>
        <form (ngSubmit)="aplicarFiltros()" aria-label="Filtros de búsqueda de exhortos enviados">
            <div class="grid grid-cols-12 gap-4 w-full items-end">
                <!-- Folio -->
                <div class="col-span-12 md:col-span-6 lg:col-span-4 w-full">
                    <label for="folio" class="block mb-2 text-sm font-medium">Folio</label>

                    <p-inputmask fluid [(ngModel)]="filtro.folio" name="folio" class="uppercase text-sm rounded-lg"
                        mask="9999/9999" placeholder="0001/2026" />
                </div>

                <!-- Estatus -->
                <div class="col-span-12 md:col-span-6 lg:col-span-2 w-full">
                    <label for="estado" class="block mb-2 text-sm font-medium">Estatus</label>

                    <p-select inputId="estado" name="estado" class="w-full" [options]="estadoOptions"
                        [(ngModel)]="filtro.estado" optionLabel="label" optionValue="value" appendTo="body" fluid
                        [attr.aria-label]="'Estatus'"></p-select>
                </div>

                <!-- Fecha -->
                <div class="col-span-12 md:col-span-8 lg:col-span-3 ">
                    <label for="rangeDates" class="block mb-2 text-sm font-medium">Fecha</label>

                    <p-datepicker inputId="rangeDates" name="rangeDates" fluid placeholder="Selecciona rango"
                        [(ngModel)]="filtro.rangeDates" selectionMode="range" [readonlyInput]="true"></p-datepicker>
                </div>

                <!-- Botones -->
                <div class="col-span-12 md:col-span-4 lg:col-span-2 flex gap-4 ">
                    <p-button type="button" icon="pi pi-filter-slash" [outlined]="true" (click)="limpiarFiltros()"
                        aria-label="Limpiar filtros"></p-button>

                    <p-button type="submit" aria-label="Buscar" styleClass="btn-secondary">
                        <i pButtonIcon class="pi pi-search" aria-hidden="true"></i>
                        <span pButtonLabel>Buscar</span>
                    </p-button>
                </div>
            </div>
        </form>

    </div>
</div>

<!--Tabla-->
<div class="relative z-0 mt-4  border border-surface rounded-2xl mb-4 p-4">

    <div class="card">
        <p-table #dtInicio [value]="audiencias" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true"
            [globalFilterFields]="[
    'folio',
    'cat_via_materia.cat_materia.Descripcion',
    'cat_via_materia.cat_via.descripcion',
    'historial_estado.0.estado.descripcion'
  ]">
            <ng-template #caption>
                <div class="flex">
                    <div class="font-bold text-2xl text-surface-900 dark:text-surface-0 mb-4">Resultado</div>

                    <p-iconfield iconPosition="left" class="ml-auto">
                        <p-inputicon><i class="pi pi-search"></i></p-inputicon>
                        <input pInputText type="text" (input)="dtInicio.filterGlobal($event.target.value, 'contains')"
                            placeholder="Buscar una palabra" aria-label="Buscar" />
                    </p-iconfield>
                </div>
            </ng-template>

            <ng-template #header>
                <tr>
                    <th>Expediente</th>
                    <th>Folio</th>
                    <th>Titulo</th>
                    <th>Hora Inicio</th>
                    <th>Hora Fin</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </ng-template>

            <ng-template #body let-audiencia>
                <tr>
                    <td>{{ audiencia.expediente.NumExpediente }}</td>
                    <td>{{ audiencia. folio}}</td>
                    <td>{{ audiencia.title }}</td>
                    <td>{{ audiencia.start | date:'dd/MM/yyyy HH:mm' }}</td>
                    <td>{{ audiencia.end | date:'dd/MM/yyyy HH:mm' }}</td>
                    <td>
                        <p-tag [value]="(getEstadoDescripcion(audiencia) | uppercase) ?? ''"
                            [severity]="getEstadoTag(audiencia).severity" [icon]="getEstadoTag(audiencia).icon" />
                    </td>
                    <td>
                        <p-button (click)="detalle(audiencia.idAudiencia)" [rounded]="true" [text]="true"
                            [raised]="true" severity="info" [rounded]="true" icon="pi pi-eye" pTooltip="Ver detalle"
                            tooltipPosition="top" title="Detalle">
                        </p-button>

                    </td>
                </tr>
            </ng-template>

            <ng-template #emptymessage>
                <tr>
                    <td colspan="6">Sin registros</td>
                </tr>
            </ng-template>
        </p-table>

    </div>
</div>

<p-toast></p-toast>
