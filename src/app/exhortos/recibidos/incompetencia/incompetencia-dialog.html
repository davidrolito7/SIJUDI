<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [closable]="true"
  appendTo="body"
  [style]="{width: '400px'}"
  header="Mi diálogo personalizado">

  <form [formGroup]="incompetenciaForm">
    <div class="w-full mb-4 border border-gray-200 rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600">
        <div class="px-4 py-2 bg-white rounded-t-lg dark:bg-gray-800">
            
            <label for="message" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Escriba la justificación por la que se declara la incompetencia</label>
            <textarea #Justificacion id="Justificacion" formControlName="justificacion" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" ></textarea>

        </div>
        
    </div>
</form>

<ng-template pTemplate="footer">
    <p-button label="Cancel" icon="pi pi-times" text (click)="close()" />
    <p-button label="Agregar" icon="pi pi-check" (click)="GuardarIncompetencia()" />
</ng-template>
</p-dialog>
