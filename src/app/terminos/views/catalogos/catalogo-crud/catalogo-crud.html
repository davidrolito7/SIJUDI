<!-- ===================================================== -->
<!-- TOAST GLOBAL -->
<!-- ===================================================== -->
<p-toast></p-toast>

<!-- ===================================================== -->
<!-- CONFIRMACIONES -->
<!-- ===================================================== -->
<app-confirm-dialog key="guardarCatalogo" title="Confirmación" [message]="modoEdicion 
      ? '¿Está seguro de actualizar la información del registro seleccionado?' 
      : '¿Está seguro de guardar este nuevo registro en el catálogo?'" icon="pi pi-check" circleClass="bg-primary"
  acceptStyleClass="bg-primary">
</app-confirm-dialog>

<app-confirm-dialog key="eliminarCatalogo" title="Confirmación"
  message="Esta acción eliminará permanentemente el registro seleccionado. ¿Desea continuar?"
  icon="pi pi-exclamation-triangle" circleClass="bg-red-500" acceptStyleClass="bg-red-600 border-red-600">
</app-confirm-dialog>

<!-- ===================================================== -->
<!-- BREADCRUMB -->
<!-- ===================================================== -->
<app-breadcrub></app-breadcrub>
<app-spinner [isLoading]="isLoading" ></app-spinner>


<div class="mt-4 bg-surface-50 dark:bg-surface-950 border border-surface rounded-2xl p-4">
  <form [formGroup]="form">

    <p-table #dt2 [value]="catalogos" selectionMode="single" [(selection)]="selectedItem"
      (onRowSelect)="seleccionar($event.data)" [scrollable]="true" scrollHeight="400px"
      [globalFilterFields]="['cve','descripcion']" class="mb-6">

      <ng-template pTemplate="caption">
        <div class="font-medium text-2xl mb-4">
          Términos catálogos
        </div>
        <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-end w-full">

          <!-- TIPO DE CATÁLOGO -->
          <div class="w-full sm:w-auto sm:min-w-48">
            <label class="block mb-1 text-sm font-medium">Tipo Catálogo</label>
            <p-select [options]="tipos" [(ngModel)]="selectedTipo" [ngModelOptions]="{ standalone: true }"
              (onChange)="onTipoChange()" optionLabel="label" optionValue="value" class="w-full" fluid
              placeholder="Selecciona tipo" appendTo="body">
            </p-select>
          </div>

          <!-- INSTANCIA (CONDICIONAL) -->
          <div class="w-full sm:w-auto sm:min-w-48" *ngIf="mostrarInstancia">
            <label class="block mb-1 text-sm font-medium">Instancia</label>
            <p-select [options]="instanciasDisponibles" [(ngModel)]="selectedInstancia"
              [ngModelOptions]="{ standalone: true }" (onChange)="onInstanciaChange()" optionLabel="label"
              optionValue="value" class="w-full" fluid placeholder="Selecciona instancia" appendTo="body">
            </p-select>
          </div>

          <div class="w-full sm:w-auto sm:ml-auto">
            <label class="block mb-1 text-sm font-medium opacity-0 sm:block">Buscar</label>
            <p-iconfield iconPosition="left" class="w-full">
              <p-inputicon>
                <i class="pi pi-search"></i>
              </p-inputicon>
              <input pInputText type="text" (input)="dt2.filterGlobal($any($event.target).value, 'contains')"
                placeholder="Buscar..." class="w-full" />
            </p-iconfield>
          </div>

        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th style="width:150px">Clave</th>
          <th>Descripción</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-item>
        <tr [pSelectableRow]="item">
          <td>{{ item.cve || item.clave || item.cveAnexo }}</td>
          <td>{{ item.descripcion }}</td>
        </tr>
      </ng-template>

    </p-table>

    <!-- ========================= -->
    <!-- FORM INPUTS -->
    <!-- ========================= -->
    <div class="grid grid-cols-4 gap-4">

      <!-- CLAVE -->
      <div class="col-span-4 sm:col-span-1">
        <label class="block mb-2 text-sm font-medium">Clave</label>
        <input pInputText maxlength="4" formControlName="cve" class="w-full uppercase"
          (keydown.enter)="moveNext($event)" />
      </div>

      <!-- DESCRIPCIÓN -->
      <div class="col-span-4 sm:col-span-3">
        <label class="block mb-2 text-sm font-medium">Descripción</label>
        <input pInputText formControlName="descripcion" [attr.maxlength]="getMaxDescripcion()" class="w-full" />
        <small class="text-xs text-gray-500">
          {{ form.get('descripcion')?.value?.length || 0 }} / {{ getMaxDescripcion() }}
        </small>
      </div>

    </div>


    <div class="flex flex-wrap justify-end gap-3 mt-6 pt-4">

      <p-button label="Nuevo" icon="pi pi-file" (click)="nuevo()">
      </p-button>

      <p-button [label]="modoEdicion ? 'Actualizar' : 'Guardar'" icon="pi pi-save" (click)="confirmarGuardar()">
      </p-button>

      <p-button label="Borrar" icon="pi pi-trash" (onClick)="confirmarBorrar()" [disabled]="!selectedItem">
      </p-button>

      <p-button label="Cancelar" icon="pi pi-times" styleClass="btn-secondary" (click)="nuevo()">
      </p-button>

    </div>

  </form>
</div>
