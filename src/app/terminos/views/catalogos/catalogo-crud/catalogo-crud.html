<!-- ===================================================== -->
<!-- TOAST GLOBAL -->
<!-- ===================================================== -->
<p-toast></p-toast>


<!-- ===================================================== -->
<!-- CONFIRMACIONES -->
<!-- ===================================================== -->

<!-- ================================ -->
<!-- CONFIRMAR GUARDAR / ACTUALIZAR -->
<!-- ================================ -->
<app-confirm-dialog
  key="guardarCatalogo"
  title="Confirmación"
  [message]="modoEdicion 
      ? '¿Está seguro de actualizar la información del registro seleccionado?' 
      : '¿Está seguro de guardar este nuevo registro en el catálogo?'"
  icon="pi pi-check"
  circleClass="bg-primary"
  acceptStyleClass="bg-primary">
</app-confirm-dialog>

<!-- ================================ -->
<!-- CONFIRMAR ELIMINACIÓN -->
<!-- ================================ -->
<app-confirm-dialog
  key="eliminarCatalogo"
  title="Confirmación"
  message="Esta acción eliminará permanentemente el registro seleccionado. ¿Desea continuar?"
  icon="pi pi-exclamation-triangle"
  circleClass="bg-red-500"
  acceptStyleClass="bg-red-600 border-red-600">
</app-confirm-dialog>



<!-- ===================================================== -->
<!-- CONTENEDOR PRINCIPAL -->
<!-- ===================================================== -->
<div class="sticky top-0 z-50 bg-surface-50 dark:bg-surface-900 flex flex-col gap-4">
  <!-- BREADCRUMB -->
  <app-breadcrub></app-breadcrub>
</div>
<div class="m-9 bg-surface-50 border border-surface rounded-2xl p-6">

  <!-- ================================ -->
  <!-- FORMULARIO PRINCIPAL -->
  <!-- ================================ -->
  <form [formGroup]="form">

    <!-- ========================= -->
    <!-- PARTE SUPERIOR (FILTROS) -->
    <!-- ========================= -->
    <div class="grid grid-cols-4 gap-4 mb-6">

      <!-- ================================ -->
      <!-- TIPO DE CATÁLOGO -->
      <!-- ================================ -->
      <div>
        <label class="block mb-2 text-sm font-medium">Tipo Catálogo</label>
        <p-select
          [options]="tipos"
          [(ngModel)]="selectedTipo"
          [ngModelOptions]="{ standalone: true }"
          (onChange)="onTipoChange()"
          optionLabel="label"
          optionValue="value"
          class="w-full">
        </p-select>
      </div>

      <!-- ================================ -->
      <!-- INSTANCIA (CONDICIONAL) -->
      <!-- ================================ -->
      <div *ngIf="mostrarInstancia">
        <label class="block mb-2 text-sm font-medium">Instancia</label>
        <p-select
          [options]="instanciasDisponibles"
          [(ngModel)]="selectedInstancia"
          [ngModelOptions]="{ standalone: true }"
          (onChange)="onInstanciaChange()"
          optionLabel="label"
          optionValue="value"
          class="w-full">
        </p-select>
      </div>

    </div>


    <!-- ========================= -->
    <!-- TABLA DE REGISTROS -->
    <!-- ========================= -->
    <p-table
      #dt2
      [value]="catalogos"
      selectionMode="single"
      [(selection)]="selectedItem"
      (onRowSelect)="seleccionar($event.data)"
      [scrollable]="true"
      scrollHeight="400px"
      [globalFilterFields]="['cve','descripcion']"
      class="mb-6">

      <!-- ================================ -->
      <!-- BUSCADOR GLOBAL -->
      <!-- ================================ -->
      <ng-template pTemplate="caption">
        <div class="flex">
          <p-iconfield iconPosition="left" class="ml-auto">
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
            <input 
              pInputText 
              type="text"
              (input)="dt2.filterGlobal($any($event.target).value, 'contains')" 
              placeholder="Buscar..." />
          </p-iconfield>
        </div>
      </ng-template>

      <!-- ================================ -->
      <!-- HEADER -->
      <!-- ================================ -->
      <ng-template pTemplate="header">
        <tr>
          <th style="width:150px">Clave</th>
          <th>Descripción</th>
        </tr>
      </ng-template>

      <!-- ================================ -->
      <!-- BODY -->
      <!-- ================================ -->
      <ng-template pTemplate="body" let-item>
        <tr [pSelectableRow]="item">
          <td>{{ item.cve || item.clave || item.cveAnexo }}</td>
          <td>{{ item.descripcion }}</td>
        </tr>
      </ng-template>

    </p-table>


    <!-- ========================= -->
    <!-- PARTE INFERIOR (FORM INPUTS) -->
    <!-- ========================= -->
    <div class="grid grid-cols-4 gap-4">

      <!-- ================================ -->
      <!-- CAMPO CLAVE -->
      <!-- ================================ -->
      <div>
        <label class="block mb-2 text-sm font-medium">Clave</label>
        <input
          pInputText
          maxlength="4"
          formControlName="cve"
          class="w-full uppercase"
          (keydown.enter)="moveNext($event)" />
      </div>

      <!-- ================================ -->
      <!-- CAMPO DESCRIPCIÓN -->
      <!-- ================================ -->
      <div class="col-span-3">
        <label class="block mb-2 text-sm font-medium">Descripción</label>
        <input
          pInputText
          formControlName="descripcion"
          [attr.maxlength]="getMaxDescripcion()"
          class="w-full" />

        <!-- CONTADOR DE CARACTERES -->
        <small class="text-xs text-gray-500">
          {{ form.get('descripcion')?.value?.length || 0 }} /
          {{ getMaxDescripcion() }}
        </small>
      </div>

    </div>


    <!-- ========================= -->
    <!-- BOTONES DE ACCIÓN -->
    <!-- ========================= -->
    <div class="flex justify-end gap-3 mt-6 pt-4">

      <!-- NUEVO -->
      <p-button
        label="Nuevo"
        icon="pi pi-file"
        class="p-button-secondary"
        (click)="nuevo()">
      </p-button>

      <!-- GUARDAR / ACTUALIZAR -->
      <p-button
        [label]="modoEdicion ? 'Actualizar' : 'Guardar'"
        icon="pi pi-save"
        class="p-button-success"
        (click)="confirmarGuardar()">
      </p-button>

      <!-- BORRAR -->
      <p-button
        label="Borrar"
        icon="pi pi-trash"
        class="p-button-danger"
        (onClick)="confirmarBorrar()"
        [disabled]="!selectedItem">
      </p-button>

      <!-- CANCELAR -->
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        class="p-button-secondary"
        (click)="nuevo()">
      </p-button>

    </div>

  </form>

</div>
