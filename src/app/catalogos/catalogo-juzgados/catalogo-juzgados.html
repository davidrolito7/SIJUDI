<app-spinner [isLoading]="isLoading"></app-spinner>

<div class="sticky top-0 z-50 bg-surface-50 dark:bg-surface-950 flex flex-col gap-4">

    <!-- HEADER -->

<app-header></app-header>
    <div class="bg-surface-50 dark:bg-surface-950 border border-surface rounded-2xl p-4">

        <div class="flex items-start flex-col md:flex-row justify-between">
            <div>
                <label class="font-bold text-2xl text-surface-900 dark:text-surface-0 mb-4 md:mb-0">
                    Listado de juzgados
                </label>
                <label class="flex items-center text-surface-700 dark:text-surface-300 flex-wrap gap-8">
                    Consulta, modifica o agrega nuevos juzgados al catálogo
                </label>
            </div>

            <div class="mt-6 md:mt-0 flex items-center">
                <button (click)="visibleDrawer = true" pButton class="whitespace-nowrap btn-secondary  ">
                    <i pButtonIcon class="pi pi-plus color"></i>
                    <span pButtonLabel>Agregar</span>
                </button>

            </div>


        </div>

    </div>
</div>

<div class="relative z-0 mt-4 bg-surface-50 dark:bg-surface-950 border border-surface rounded-2xl mb-4 p-4">
    <p-table #dt1 [value]="listaJuzgado" dataKey="idJuzgado" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]"
        [paginator]="true" [globalFilterFields]="['descripcion']">
        <ng-template #caption>
            <div class="flex ">
                <p-button label="Limpiar" [outlined]="true" icon="pi pi-filter-slash" (click)="clear(dt1)" />
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon><i class="pi pi-search"></i></p-inputicon>
                    <input pInputText type="text" (input)="dt1.filterGlobal($event.target.value, 'contains')"
                        placeholder="Buscar " />
                </p-iconfield>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th style="min-width:15rem">
                    <div class="flex items-center justify-between">
                        idJuzgado
                        <p-columnfilter type="text" field="idJuzgado" display="menu" />
                    </div>
                </th>
                <th style="min-width:15rem">
                    <div class="flex items-center justify-between">
                        Clave
                        <p-columnfilter type="text" field="clave" display="menu"></p-columnfilter>
                    </div>
                </th>
                <th style="min-width:15rem">
                    <div class="flex items-center justify-between">
                        Descripción
                        <p-columnfilter type="text" field="descripcion" display="menu"></p-columnfilter>
                    </div>
                </th>
                <th style="min-width:15rem">
                    <div class="flex items-center justify-between">
                        Instancia
                        <p-columnfilter type="text" field="descripcion" display="menu"></p-columnfilter>
                    </div>
                </th>
                <th style="min-width:15rem">
                    <div class="flex items-center justify-between">
                        Municipio
                        <p-columnfilter type="text" field="descripcion" display="menu"></p-columnfilter>
                    </div>
                </th>
                <th style="min-width:15rem">
                    <div class="flex items-center justify-between">
                        Activo
                        <p-columnfilter type="text" field="activo" display="menu"></p-columnfilter>
                    </div>
                </th>
                <th style="min-width:10rem">
                    <div class="flex items-center justify-between">
                        Acciones
                    </div>
                </th>
            </tr>
        </ng-template>

        <ng-template #body let-lista>
            <tr>
                <td>{{ lista.idJuzgado }}</td>
                <td>{{ lista.clave }}</td>
                <td>{{ lista.descripcion }}</td>
                <td> {{lista.instancia}}</td>
                <td> {{lista.municipio?.descripcion}}</td>
                <td>
                    <p-tag [value]="lista.activo ? 'Activo' : 'Inactivo'" [severity]="lista.activo ? 'info' : 'danger'"
                        [rounded]="true">
                    </p-tag>
                </td>
                <td> <p-button type="button" class="btn-secondary">
                        <i class="pi pi-pencil"></i>
                    </p-button></td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="7">No customers found.</td>
            </tr>
        </ng-template>
    </p-table>
</div>


<p-drawer header="Agregar juzgado" [(visible)]="visibleDrawer" position="right" styleClass="!w-full sm:!w-[30rem] ">
    <form class="flex flex-col" [formGroup]="juzgadoForm">
        <div class="grid grid-cols-6 gap-4 w-full items-end">
            <!-- Región -->
            <div class="col-span-6">
                <label class="block mb-2 text-sm font-medium">Nombre</label>

                <input pInputText type="text" formControlName="nombre" class="w-full"
                    placeholder="Ingrese el nombre del juzgado" />
            </div>


            <div class="col-span-6 flex justify-center">
                <button pButton type="submit" (click)="onConfirAgregarJuzgado()">
                    <i pButtonIcon class="pi pi-save"></i>
                    <span pButtonLabel>Guardar</span>
                </button>
            </div>
        </div>
    </form>

</p-drawer>

<app-confirm-dialog key="confirm" title="Confirmación" message="¿Desea continuar?" icon="pi pi-check"
    circleClass="bg-primary" acceptStyleClass="bg-primary">
</app-confirm-dialog>

<app-confirm-dialog key="success" title="Confirmación"
    message="Juzgado agregado correctamente."
    icon="pi pi-check" circleClass="bg-primary" acceptLabel="Aceptar" acceptStyleClass="bg-primary"  [showReject]="false">
</app-confirm-dialog>
