<nav
    aria-label="Breadcrumb"
    class="flex min-h-7 items-center gap-2
           overflow-x-auto whitespace-nowrap
           text-sm"
>
    <a
        routerLink="/"
        aria-label="Inicio"
        class="inline-flex items-center
               text-surface-400
               transition-colors
               hover:text-surface-800
               dark:text-surface-500
               dark:hover:text-surface-100"
    >
        <i class="pi pi-home text-xs"></i>
    </a>

    @for (item of breadcrumbs; track item.label; let last = $last) {

        <i
            class="pi pi-angle-right text-[0.6rem]
                   text-surface-300
                   dark:text-surface-700"
            aria-hidden="true"
        ></i>

        @if (last) {
            <span
                aria-current="page"
                class="font-medium
                       text-surface-700
                       dark:text-surface-200"
            >
                {{ item.label }}
            </span>
        }

        @if (!last) {
            <a
                [routerLink]="item.routerLink"
                class="text-surface-400
                       transition-colors
                       hover:text-surface-800
                       dark:text-surface-500
                       dark:hover:text-surface-100"
            >
                {{ item.label }}
            </a>
        }
    }
</nav>
