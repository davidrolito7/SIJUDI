<header
        class="border border-surface rounded-2xl bg-surface-50 dark:bg-surface-900 flex items-center justify-between overflow-hidden">
        <p-breadcrumb class="hidden lg:block" styleClass="bg-surface-50 dark:bg-surface-900" [home]="home"
            [model]="items" />

        <div class="ml-auto flex items-center gap-3 pr-4 pt-2 pb-2">
            <div class="flex flex-col leading-tight text-right">
                <span class="text-base font-semibold text-surface-700 dark:text-surface-200">
                     {{ abogadoNombre }}
                </span>

                <span class="text-xs text-surface-500 dark:text-surface-400">
                    {{ areaNombre ? ('Área: ' + areaNombre) : '' }}
                    {{ areaNombre && perfilNombre ? ' · ' : '' }}
                    {{ perfilNombre ? ('Perfil: ' + perfilNombre) : '' }}
                </span>
            </div>

            <p-avatar
                [image]="abogadoFotoUrl"
                size="large"
                shape="circle"
                class="shrink-0 p-avatar p-avatar-circle p-avatar-image p-avatar-lg p-component"
            ></p-avatar>
        </div>
    </header>
