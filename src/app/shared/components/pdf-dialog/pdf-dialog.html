<p-dialog
  [header]="header"
  styleClass="dialog-compact"
  maskStyleClass="bg-primary/40!"
  [modal]="true"
  [(visible)]="visible"
  (visibleChange)="onVisibleChange($event)"
  [appendTo]="'body'"
  [baseZIndex]="100"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '70vw', height: '90vh' }"
  [contentStyle]="{ overflow: 'hidden', height: 'calc(90vh - 3rem)' }"
  [draggable]="false"
  [resizable]="false">
  
  <iframe @if(url) [src]="url" type="application/pdf" width="100%" height="100%">
    <p>
      No se pudo mostrar el PDF.
      <a [href]="url" download>Descargar</a> en su lugar.
    </p>
  </iframe>
</p-dialog>
