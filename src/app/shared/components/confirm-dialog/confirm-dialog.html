<p-dialog [visible]="visible()" (visibleChange)="visible.set($event)" [modal]="true" [showHeader]="false" [closable]="false" [dismissableMask]="false"
  [draggable]="false" [resizable]="false" appendTo="body" styleClass="confirm-dialog-panel"
  [style]="{ width: '26rem' }" (onHide)="onReject()">
  <div class="flex flex-col items-center text-center px-2 pt-6 pb-2">
    <div class="rounded-full inline-flex justify-center items-center h-20 w-20 shadow-md" [ngClass]="circleClass">
      <i class="pi text-4xl! text-surface-0" [ngClass]="icon"></i>
    </div>

    <p class="text-xl font-semibold mt-4 mb-1 text-surface-900 dark:text-surface-0">{{ title }}</p>
    <p class="text-surface-600 dark:text-surface-300 mb-0 leading-relaxed">{{ message }}</p>

    <div class="flex items-center justify-center gap-3 mt-6 w-full">
      @if (showReject) {
      <p-button [label]="rejectLabel" [outlined]="true" (onClick)="onReject()" styleClass="min-w-32 flex-1">
      </p-button>
      }
      @if (showAccept) {
      <p-button [label]="acceptLabel" (onClick)="onAccept()" [styleClass]="acceptStyleClass + ' min-w-32 flex-1'">
      </p-button>
      }
    </div>
  </div>
</p-dialog>
