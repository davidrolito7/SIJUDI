<app-header></app-header>
    <app-breadcrub></app-breadcrub>
    
<div class="w-full max-w-xl rounded-2xl border border-black/10 bg-white p-6 shadow-sm">
  <div class="flex flex-col gap-2 mb-6">
    <h2 class="text-xl font-semibold text-black m-0">
      Llave de acceso
    </h2>

    <p class="text-sm text-black/60 m-0 leading-relaxed">
      Registra una llave de acceso para entrar posteriormente con Face ID,
      huella digital, PIN del dispositivo o Windows Hello, sin escribir usuario ni contraseña.
    </p>
  </div>

  <button
    pButton
    type="button"
    [loading]="isLoading"
    (click)="registrarLlaveAcceso()"
  >
    <i class="pi pi-key mr-2"></i>
    <span pButtonLabel>Registrar llave de acceso</span>
  </button>
</div>

<p-toast></p-toast>
